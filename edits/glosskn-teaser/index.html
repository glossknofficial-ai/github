<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      /* Futura is used when installed on the rendering machine; Jost (open-source Futura revival) is the bundled fallback. */
      @font-face { font-family: "GK Futura"; font-weight: 400; src: local("Futura Book"), local("Futura-Book"), local("Futura PT Book"), url(fonts/jost-latin-400-normal.woff2) format("woff2"); }
      @font-face { font-family: "GK Futura"; font-weight: 500; src: local("Futura Medium"), local("Futura-Medium"), local("Futura PT Medium"), url(fonts/jost-latin-500-normal.woff2) format("woff2"); }
      @font-face { font-family: "GK Futura"; font-weight: 600; src: local("Futura Bold"), local("Futura-Bold"), local("Futura PT Demi"), url(fonts/jost-latin-600-normal.woff2) format("woff2"); }
      :root { --plum: #3e2150; --deep: #8e6aa1; --lilac: #d7b6e2; --mist: #f3e4f8; --white: #ffffff; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--plum); }
      body { font-family: "GK Futura", sans-serif; color: var(--white); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }

      /* ---------- background */
      #bg { position: absolute; inset: -10%; background: linear-gradient(180deg, #2f1840 0%, #5d3a73 30%, #80599a 62%, #a77fba 100%); }
      .glow { position: absolute; border-radius: 50%; filter: blur(140px); }
      #g1 { width: 900px; height: 900px; left: -250px; top: 900px; background: #e6cdef; opacity: .32; }
      #g2 { width: 800px; height: 800px; right: -300px; top: 250px; background: #b58ac9; opacity: .45; }
      #vig { position: absolute; inset: 0; background: radial-gradient(ellipse 85% 70% at 50% 55%, transparent 55%, rgba(30, 12, 42, .55) 100%); }
      #grain { position: absolute; inset: 0; opacity: .14; mix-blend-mode: overlay; }

      /* ---------- chat bubbles */
      #chat { position: absolute; inset: 0; }
      .head { position: absolute; left: 140px; right: 140px; top: 330px; padding: 34px 40px; border-radius: 44px; text-align: center;
              background: rgba(46, 20, 62, .38); border: 1.5px solid rgba(243, 228, 248, .18); backdrop-filter: blur(16px);
              font: 500 46px/1.1 "GK Futura", sans-serif; letter-spacing: .2px; }
      .b { position: absolute; padding: 30px 48px; border-radius: 48px; white-space: nowrap;
           background: rgba(58, 26, 78, .26); border: 1.5px solid rgba(255, 255, 255, .22); backdrop-filter: blur(14px);
           box-shadow: 0 14px 40px rgba(40, 14, 56, .18); text-shadow: 0 2px 10px rgba(40, 14, 56, .45);
           font: 500 42px/1.1 "GK Futura", sans-serif; }
      .b.L { left: 100px; border-bottom-left-radius: 14px; }
      .b.R { right: 100px; border-bottom-right-radius: 14px; background: rgba(215, 182, 226, .30); }
      .b, .head { opacity: 0; }

      /* ---------- headline */
      #hl { position: absolute; inset: 0; text-align: center; }
      .kick { position: absolute; left: 0; right: 0; top: 300px; font: 500 26px/1 "GK Futura", sans-serif; letter-spacing: 9px; color: var(--mist); }
      .big { position: absolute; left: 0; right: 0; top: 700px; font: 600 118px/1.04 "GK Futura", sans-serif; letter-spacing: 2px; text-transform: uppercase;
             text-shadow: 0 6px 40px rgba(40, 14, 56, .35); }
      .big .ln { display: block; }
      .big .ln.st { margin-top: 70px; color: var(--mist); }
      .big .w { display: inline-block; opacity: 0; }
      .url { position: absolute; left: 0; right: 0; top: 1610px; font: 500 24px/1 "GK Futura", sans-serif; letter-spacing: 7px; color: var(--mist); text-shadow: 0 2px 12px rgba(40, 14, 56, .6); }
      .kick, .url { opacity: 0; }

      /* ---------- logo */
      #logo { position: absolute; inset: 0; }
      .mark { position: absolute; left: 0; right: 0; top: 880px; text-align: center; font: 500 150px/1 "GK Futura", sans-serif; letter-spacing: 26px; padding-left: 26px;
              text-shadow: 0 8px 48px rgba(40, 14, 56, .35); }
      .mark .c { display: inline-block; opacity: 0; }
      .mark .o { position: relative; }
      #spark { position: absolute; left: 50%; top: -104px; width: 84px; height: 84px; margin-left: -55px; opacity: 0; }
      .line { position: absolute; left: 50%; top: 1080px; width: 260px; height: 2px; margin-left: -130px; background: var(--lilac); transform-origin: 50% 50%; }
      .tag { position: absolute; left: 0; right: 0; top: 1120px; text-align: center; font: 400 30px/1 "GK Futura", sans-serif; letter-spacing: 10px; color: var(--mist); opacity: 0; text-shadow: 0 2px 12px rgba(40, 14, 56, .6); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10.4" data-width="1080" data-height="1920">
      <div id="bgwrap" class="clip" data-start="0" data-duration="10.4" data-track-index="0" style="position:absolute;inset:0">
        <div id="bg"></div>
        <div class="glow" id="g1"></div>
        <div class="glow" id="g2"></div>
        <div id="vig"></div>
        <svg id="grain" width="1080" height="1920"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
      </div>

      <!-- scene 1: the DMs -->
      <div id="chat" class="clip" data-start="0" data-duration="3.9" data-track-index="2">
        <div class="head" id="h0">Okay… is this really happening?</div>
        <div class="b L" id="b1" style="top:560px">Been waiting forever for this</div>
        <div class="b R" id="b2" style="top:720px">Just tell us already!</div>
        <div class="b L" id="b3" style="top:880px">Is it dropping this week?</div>
        <div class="b R" id="b4" style="top:1040px">I literally can't wait</div>
        <div class="b L" id="b5" style="top:1200px">Pleaseee say it's soon</div>
        <div class="b R" id="b6" style="top:1360px">Ready when you are.</div>
      </div>

      <!-- scene 2: the tease -->
      <div id="hl" class="clip" data-start="3.75" data-duration="3.75" data-track-index="3">
        <div class="kick" id="kick">SOMETHING NEW</div>
        <div class="big">
          <span class="ln"><span class="w" id="w1">It's</span></span>
          <span class="ln"><span class="w" id="w2">closer</span></span>
          <span class="ln"><span class="w" id="w3">than</span> <span class="w" id="w4">you</span></span>
          <span class="ln"><span class="w" id="w5">think</span></span>
          <span class="ln st"><span class="w" id="w6">Stay</span></span>
          <span class="ln" style="color:var(--mist)"><span class="w" id="w7">tuned.</span></span>
        </div>
        <div class="url" id="url">WWW.GLOSSKN.COM</div>
      </div>

      <!-- scene 3: the mark -->
      <div id="logo" class="clip" data-start="7.45" data-duration="2.95" data-track-index="4">
        <div class="mark"><span class="c">G</span><span class="c">L</span><span class="c o">O<svg id="spark" viewBox="0 0 100 100"><path d="M50 0 C54 36 64 46 100 50 C64 54 54 64 50 100 C46 64 36 54 0 50 C36 46 46 36 50 0Z" fill="#d7b6e2"/></svg></span><span class="c">S</span><span class="c">S</span><span class="c">K</span><span class="c">N</span></div>
        <div class="line" id="line"></div>
        <div class="tag" id="tag">COMING SOON</div>
      </div>

      <!-- sound -->
      <audio id="bed" src="sfx/bed.wav" data-start="0" data-duration="10.4" data-track-index="10" data-volume="0.9"></audio>
      <audio id="s1" src="sfx/pop.wav" data-start="0.30" data-duration="0.11" data-track-index="11"></audio>
      <audio id="s2" src="sfx/pop.wav" data-start="0.85" data-duration="0.11" data-track-index="12"></audio>
      <audio id="s3" src="sfx/pop.wav" data-start="1.25" data-duration="0.11" data-track-index="11"></audio>
      <audio id="s4" src="sfx/pop.wav" data-start="1.65" data-duration="0.11" data-track-index="12"></audio>
      <audio id="s5" src="sfx/pop.wav" data-start="2.05" data-duration="0.11" data-track-index="11"></audio>
      <audio id="s6" src="sfx/pop.wav" data-start="2.45" data-duration="0.11" data-track-index="12"></audio>
      <audio id="s7" src="sfx/pop.wav" data-start="2.85" data-duration="0.11" data-track-index="11"></audio>
      <audio id="s8" src="sfx/whoosh.wav" data-start="3.55" data-duration="0.6" data-track-index="13" data-volume="0.6"></audio>
      <audio id="s9" src="sfx/blip.wav" data-start="4.05" data-duration="0.36" data-track-index="14" data-volume="0.35"></audio>
      <audio id="s10" src="sfx/blip.wav" data-start="4.45" data-duration="0.36" data-track-index="15" data-volume="0.35"></audio>
      <audio id="s11" src="sfx/blip.wav" data-start="4.85" data-duration="0.36" data-track-index="14" data-volume="0.35"></audio>
      <audio id="s12" src="sfx/blip.wav" data-start="5.25" data-duration="0.36" data-track-index="15" data-volume="0.35"></audio>
      <audio id="s13" src="sfx/riser.wav" data-start="5.95" data-duration="1.5" data-track-index="13" data-volume="0.45"></audio>
      <audio id="s14" src="sfx/impact.wav" data-start="7.45" data-duration="2.8" data-track-index="14" data-volume="0.4"></audio>
      <audio id="s15" src="sfx/shimmer.wav" data-start="8.05" data-duration="2.3" data-track-index="15" data-volume="0.5"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // background drift
      tl.fromTo("#bg", { y: 0, scale: 1 }, { y: -60, scale: 1.04, duration: 10.4, ease: "none" }, 0);
      tl.fromTo("#g1", { x: 0, y: 0 }, { x: 260, y: -240, duration: 10.4, ease: "sine.inOut" }, 0);
      tl.fromTo("#g2", { x: 0, y: 0 }, { x: -220, y: 300, duration: 10.4, ease: "sine.inOut" }, 0);

      // scene 1 — bubbles pop in out of order, like DMs landing
      const pop = (sel, t, fromX) => tl.fromTo(sel, { opacity: 0, scale: 0.7, x: fromX, y: 24 },
        { opacity: 1, scale: 1, x: 0, y: 0, duration: 0.38, ease: "back.out(2.2)" }, t);
      tl.fromTo("#h0", { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.25);
      pop("#b3", 0.85, -40);
      pop("#b2", 1.25, 40);
      pop("#b4", 1.65, 40);
      pop("#b1", 2.05, -40);
      pop("#b5", 2.45, -40);
      pop("#b6", 2.85, 40);
      tl.to("#chat .b, #h0", { y: (i) => -6 - i * 2, duration: 1.6, ease: "sine.inOut" }, 2.2);
      tl.to("#chat", { opacity: 0, scale: 1.06, filter: "blur(10px)", duration: 0.32, ease: "power2.in" }, 3.55);

      // scene 2 — word-by-word tease
      tl.fromTo("#kick", { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 3.8);
      tl.fromTo("#url", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 3.9);
      const word = (sel, t) => tl.fromTo(sel, { opacity: 0, y: 40, filter: "blur(8px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.35, ease: "power3.out" }, t);
      word("#w1", 4.05); word("#w2", 4.45); word("#w3", 4.85); word("#w4", 5.0); word("#w5", 5.25);
      word("#w6", 6.0); word("#w7", 6.35);
      tl.fromTo("#hl .big", { scale: 1 }, { scale: 1.035, duration: 3.6, ease: "none" }, 3.8);
      tl.to("#hl", { opacity: 0, duration: 0.3, ease: "power2.in" }, 7.2);

      // scene 3 — wordmark
      tl.fromTo("#logo .c", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.06, immediateRender: false }, 7.5);
      tl.fromTo("#logo .c", { x: (i) => (i - 3) * 22 }, { x: 0, duration: 1.4, ease: "power3.out" }, 7.5);
      tl.fromTo("#logo .mark", { scale: 0.96 }, { scale: 1, duration: 1.4, ease: "power3.out" }, 7.5);
      tl.fromTo("#spark", { opacity: 0, scale: 0, rotation: -90 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.6, ease: "back.out(2.5)" }, 8.1);
      tl.to("#spark", { rotation: 20, duration: 1.7, ease: "sine.inOut" }, 8.7);
      tl.fromTo("#line", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, 8.3);
      tl.fromTo("#tag", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 8.5);

      tl.set({}, {}, 10.4);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
