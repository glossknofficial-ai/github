<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      /* Futura is used when installed on the rendering machine; Jost (open-source Futura revival) is the bundled fallback. */
      @font-face { font-family: "GK Futura"; font-weight: 400; src: local("Futura Book"), local("Futura-Book"), local("Futura PT Book"), url(fonts/jost-latin-400-normal.woff2) format("woff2"); }
      @font-face { font-family: "GK Futura"; font-weight: 500; src: local("Futura Medium"), local("Futura-Medium"), local("Futura PT Medium"), url(fonts/jost-latin-500-normal.woff2) format("woff2"); }
      @font-face { font-family: "GK Futura"; font-weight: 600; src: local("Futura Bold"), local("Futura-Bold"), local("Futura PT Demi"), url(fonts/jost-latin-600-normal.woff2) format("woff2"); }
      :root { --plum: #2f1840; --deep: #8e6aa1; --lilac: #d7b6e2; --mist: #f3e4f8; --ink: #22162b; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--plum); }
      body { font-family: "GK Futura", sans-serif; color: #fff; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }

      /* ---------- background */
      #bg { position: absolute; inset: -10%; background: linear-gradient(180deg, #2a1439 0%, #553366 32%, #7b5594 64%, #9f78b3 100%); }
      .glow { position: absolute; border-radius: 50%; filter: blur(140px); }
      #g1 { width: 900px; height: 900px; left: -250px; top: 900px; background: #e6cdef; opacity: .28; }
      #g2 { width: 800px; height: 800px; right: -300px; top: 250px; background: #b58ac9; opacity: .4; }
      #g3 { width: 1000px; height: 700px; left: 40px; top: 620px; background: #e7a9f5; opacity: 0; }
      #vig { position: absolute; inset: 0; background: radial-gradient(ellipse 85% 70% at 50% 52%, transparent 50%, rgba(24, 10, 34, .6) 100%); }
      #grain { position: absolute; inset: 0; opacity: .12; mix-blend-mode: overlay; }

      /* ---------- scene 1: lock-screen notifications */
      #lock { position: absolute; inset: 0; }
      .date { position: absolute; left: 0; right: 0; top: 190px; text-align: center; font: 500 34px/1 "GK Futura", sans-serif; letter-spacing: 1px; color: rgba(255, 255, 255, .85); }
      .time { position: absolute; left: 0; right: 0; top: 250px; text-align: center; font: 500 186px/1 "GK Futura", sans-serif; letter-spacing: -2px; color: rgba(255, 255, 255, .92); }
      .n { position: absolute; left: 70px; width: 940px; display: flex; align-items: center; gap: 26px; padding: 24px 32px 24px 24px;
           border-radius: 38px; background: rgba(255, 255, 255, .93); box-shadow: 0 18px 50px rgba(30, 10, 44, .28); color: var(--ink); opacity: 0; }
      .ic { flex: none; width: 84px; height: 84px; border-radius: 22px; display: grid; place-items: center;
            background: linear-gradient(145deg, #c79bd9, #8e6aa1); }
      .ic svg { width: 46px; height: 46px; }
      .tx { flex: 1; min-width: 0; }
      .r1 { display: flex; justify-content: space-between; align-items: baseline; }
      .who { font: 600 31px/1.2 "GK Futura", sans-serif; }
      .now { font: 400 26px/1 "GK Futura", sans-serif; color: #85798c; }
      .msg { margin-top: 4px; font: 400 33px/1.35 "GK Futura", sans-serif; color: #2e2436; padding-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      /* ---------- scene 2: typed tease */
      #tease { position: absolute; inset: 0; text-align: center; }
      .kick { position: absolute; left: 0; right: 0; top: 560px; display: flex; justify-content: center; align-items: center; gap: 28px;
              font: 500 30px/1 "GK Futura", sans-serif; letter-spacing: 12px; color: var(--lilac); opacity: 0; }
      .kick i { display: block; width: 90px; height: 2px; background: var(--lilac); opacity: .8; }
      .kick span { padding-left: 12px; }
      .lines { position: absolute; left: 0; right: 0; top: 790px; }
      .tl { display: block; white-space: pre; font: 500 92px/1.3 "GK Futura", sans-serif; letter-spacing: 6px; padding-left: 6px;
            text-shadow: 0 6px 34px rgba(30, 10, 44, .35); }
      .tl.st { margin-top: 120px; font: 500 54px/1 "GK Futura", sans-serif; letter-spacing: 18px; padding-left: 18px; color: var(--mist); }
      .ch { position: relative; display: inline-block; opacity: 0; }
      .cur { position: absolute; right: -9px; top: 12%; width: 4px; height: 76%; background: var(--lilac); opacity: 0; }
      .tl.st .cur { right: -14px; }
      .rule { position: absolute; left: 50%; top: 1128px; width: 140px; height: 2px; margin-left: -70px; background: var(--lilac); }
      .url { position: absolute; left: 0; right: 0; top: 1640px; font: 500 26px/1 "GK Futura", sans-serif; letter-spacing: 9px; padding-left: 9px; color: var(--mist); opacity: 0;
             text-shadow: 0 2px 12px rgba(30, 10, 44, .6); }

      /* ---------- scene 3: logo */
      #end { position: absolute; inset: 0; }
      .lockup { position: absolute; left: 140px; top: 850px; width: 800px; height: 198px; }
      .lockup img { position: absolute; inset: 0; width: 800px; height: 198px; filter: drop-shadow(0 10px 40px rgba(30, 10, 44, .35)); }
      .sheen { position: absolute; inset: 0; -webkit-mask: url(assets/glosskn-logo-white.png) center/800px 198px no-repeat; mask: url(assets/glosskn-logo-white.png) center/800px 198px no-repeat; overflow: hidden; }
      .sheen b { position: absolute; top: -40px; left: -300px; width: 220px; height: 280px; transform: skewX(-20deg);
                 background: linear-gradient(90deg, transparent, rgba(231, 169, 245, .95), transparent); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10.8" data-width="1080" data-height="1920">
      <div id="bgwrap" class="clip" data-start="0" data-duration="10.8" data-track-index="0" style="position:absolute;inset:0">
        <div id="bg"></div>
        <div class="glow" id="g1"></div>
        <div class="glow" id="g2"></div>
        <div class="glow" id="g3"></div>
        <div id="vig"></div>
        <svg id="grain" width="1080" height="1920"><filter id="nz"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#nz)"/></svg>
      </div>

      <!-- scene 1: DMs landing on a lock screen -->
      <div id="lock" class="clip" data-start="0" data-duration="3.45" data-track-index="2">
        <div class="date" id="date">Friday, 16 October</div>
        <div class="time" id="clock">9:41</div>
      </div>

      <!-- scene 2: the tease, typed out -->
      <div id="tease" class="clip" data-start="3.3" data-duration="5.2" data-track-index="3">
        <div class="kick" id="kick"><i></i><span>BIRTHDAY SALE</span><i></i></div>
        <div class="lines">
          <span class="tl" data-type="IT'S CLOSER" data-at="3.75" data-step="0.075"></span>
          <span class="tl" data-type="THAN YOU THINK" data-at="4.75" data-step="0.070"></span>
          <span class="tl st" data-type="STAY TUNED." data-at="6.25" data-step="0.085"></span>
        </div>
        <div class="rule" id="rule"></div>
        <div class="url" id="url">GLOSSKN.COM</div>
      </div>

      <!-- scene 3: the GLOSSKN logo -->
      <div id="end" class="clip" data-start="8.35" data-duration="2.45" data-track-index="4">
        <div class="lockup" id="lockup">
          <img src="assets/glosskn-logo-white.png" alt="GLOSSKN" />
          <div class="sheen"><b id="sheen"></b></div>
        </div>
      </div>

      <!-- soundtrack: chimes, keystrokes and beat, built by audio/make_audio.py -->
      <audio id="mix" src="sfx/mix.wav" data-start="0" data-duration="10.8" data-track-index="10"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ---- build notification cards (times mirror NOTIFS in audio/make_audio.py)
      const NOTIFS = [
        ["riya.sharma", "Wait… is the birthday sale finally here?", 0.30],
        ["makeupbyanaya", "Been waiting all year for this!", 0.72],
        ["tanvi_k", "Just tell us the date already", 1.12],
        ["glowwithmeher", "Is it this week??", 1.52],
        ["ishita.mehra", "My cart is literally ready", 1.92],
        ["nehaa.b", "Please say it's soon", 2.32],
        ["kavya_s", "Ready when you are!", 2.72],
      ];
      const icon = '<svg viewBox="0 0 24 24" fill="none"><path d="M12 3.5c-4.9 0-8.75 3.4-8.75 7.75 0 2.3 1.1 4.35 2.9 5.750L5.6 20.5l3.9-1.9c.8.2 1.65.3 2.5.3 4.9 0 8.750-3.4 8.750-7.65S16.9 3.5 12 3.5z" fill="#fff"/></svg>';
      const lock = document.getElementById("lock");
      NOTIFS.forEach(([who, msg], i) => {
        const el = document.createElement("div");
        el.className = "n";
        el.id = "n" + i;
        el.style.top = 520 + i * 152 + "px";
        el.innerHTML = `<div class="ic">${icon}</div><div class="tx"><div class="r1"><span class="who">${who}</span><span class="now">now</span></div><div class="msg">${msg}</div></div>`;
        lock.appendChild(el);
      });

      // ---- split typed lines into characters, each with its own caret
      const typed = [];
      document.querySelectorAll(".tl").forEach((line) => {
        const at = parseFloat(line.dataset.at), step = parseFloat(line.dataset.step);
        [...line.dataset.type].forEach((c, i) => {
          const ch = document.createElement("span");
          ch.className = "ch";
          ch.innerHTML = (c === " " ? "&nbsp;" : c) + '<span class="cur"></span>';
          line.appendChild(ch);
          typed.push({ ch, cur: ch.lastChild, t: at + i * step });
        });
      });

      // ---- background drift + beat pulse once the music drops (100 BPM from 3.30s)
      tl.fromTo("#bg", { y: 0, scale: 1 }, { y: -60, scale: 1.04, duration: 10.8, ease: "none" }, 0);
      tl.fromTo("#g1", { x: 0, y: 0 }, { x: 260, y: -240, duration: 10.8, ease: "sine.inOut" }, 0);
      tl.fromTo("#g2", { x: 0, y: 0 }, { x: -220, y: 300, duration: 10.8, ease: "sine.inOut" }, 0);
      for (let k = 0; k < 9; k++) {
        tl.fromTo("#g3", { opacity: 0.32 }, { opacity: 0.08, duration: 1.1, ease: "power2.out", immediateRender: false }, 3.3 + k * 1.2);
      }

      // ---- scene 1
      tl.fromTo("#date", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0);
      tl.fromTo("#clock", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.04);
      NOTIFS.forEach((n, i) => {
        tl.fromTo("#n" + i, { opacity: 0, y: -46, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.42, ease: "back.out(1.8)" }, n[2]);
        tl.fromTo("#lock", { x: 0 }, { keyframes: { x: [0, -5, 5, -3, 0] }, duration: 0.18, ease: "none", immediateRender: false }, n[2] + 0.02);
      });
      tl.to("#lock .n", { y: -80, opacity: 0, duration: 0.3, ease: "power2.in", stagger: 0.025 }, 3.05);
      tl.to("#date, #clock", { opacity: 0, duration: 0.25 }, 3.05);

      // ---- scene 2
      tl.fromTo("#kick", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 3.35);
      tl.fromTo("#url", { opacity: 0 }, { opacity: 0.9, duration: 0.6 }, 3.5);
      typed.forEach(({ ch, cur, t }, i) => {
        tl.set(ch, { opacity: 1 }, t);
        tl.set(cur, { opacity: 1 }, t);
        const next = typed[i + 1];
        if (next && next.t - t < 0.2) {
          tl.set(cur, { opacity: 0 }, next.t);
        } else {
          // caret blinks while waiting for the next line
          const end = next ? next.t : 8.15;
          for (let b = t + 0.35; b < end - 0.05; b += 0.7) {
            tl.set(cur, { opacity: 0 }, b);
            if (b + 0.35 < end - 0.05) tl.set(cur, { opacity: 1 }, b + 0.35);
          }
          tl.set(cur, { opacity: 0 }, end);
        }
      });
      tl.fromTo(".rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, 5.9);
      tl.fromTo(".lines", { scale: 1 }, { scale: 1.03, duration: 4.9, ease: "none" }, 3.4);
      tl.to("#tease", { opacity: 0, duration: 0.25, ease: "power2.in" }, 8.15);

      // ---- scene 3
      tl.fromTo("#lockup", { opacity: 0, scale: 0.94, clipPath: "inset(0 100% 0 0)" },
        { opacity: 1, scale: 1, clipPath: "inset(0 0% 0 0)", duration: 0.75, ease: "power3.out" }, 8.4);
      tl.fromTo("#lockup", { y: 0 }, { y: -8, duration: 2.2, ease: "sine.inOut", immediateRender: false }, 8.6);
      tl.fromTo("#sheen", { x: 0 }, { x: 1400, duration: 1.0, ease: "power2.inOut" }, 9.05);

      tl.set({}, {}, 10.8);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
