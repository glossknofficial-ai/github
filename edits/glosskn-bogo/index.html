<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      /* Brand fonts. Futura falls back to Jost; Times New Roman falls back to Tinos (metric-compatible). */
      @font-face { font-family: "GK Futura"; font-weight: 500; src: local("Futura Medium"), local("Futura-Medium"), local("Futura PT Medium"), url(fonts/jost-latin-500-normal.woff2) format("woff2"); }
      @font-face { font-family: "GK Futura"; font-weight: 600; src: local("Futura Bold"), local("Futura-Bold"), local("Futura PT Demi"), url(fonts/jost-latin-600-normal.woff2) format("woff2"); }
      @font-face { font-family: "GK Times"; font-style: normal; font-weight: 400; src: local("Times New Roman"), local("TimesNewRomanPSMT"), url(fonts/tinos-latin-400-normal.woff2) format("woff2"); }
      @font-face { font-family: "GK Times"; font-style: italic; font-weight: 400; src: local("Times New Roman Italic"), local("TimesNewRomanPS-ItalicMT"), url(fonts/tinos-latin-400-italic.woff2) format("woff2"); }
      :root { --bg: #e2c0d7; --ink: #181310; --magenta: #b8145f; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      body { font-family: "GK Futura", sans-serif; color: var(--ink); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }

      #stage { position: absolute; inset: 0; transform-origin: 50% 50%; }
      .tile { position: absolute; width: 360px; height: 384px; overflow: hidden; }
      .L { position: absolute; inset: 0; opacity: 0; background-repeat: no-repeat; }
      .L.a { background-image: url(assets/hero.png); background-size: 1080px 1933px; }
      .L.b1, .L.b2 { background-image: url(assets/hero.png); background-size: 2160px 3866px; }
      .L.c, .L.d { display: flex; align-items: center; justify-content: center; text-align: center; background: var(--bg); }
      .L.c span { font: 500 52px/1.1 "GK Futura", sans-serif; }
      .L.d span { font: italic 400 56px/1.05 "GK Times", serif; }
      .L.d span b { display: block; font: 600 30px/1 "GK Futura", sans-serif; font-style: normal; letter-spacing: 5px; padding-left: 5px; margin-top: 14px; }
      #lines { position: absolute; inset: 0; pointer-events: none; }
      #lines i { position: absolute; background: rgba(255, 255, 255, .7); }

      /* final headline */
      #head { position: absolute; inset: 0; text-align: center; }
      .logo { position: absolute; left: 400px; top: 104px; width: 280px; height: 69px; background: var(--ink);
              -webkit-mask: url(assets/glosskn-logo-white.png) center/280px 69px no-repeat; mask: url(assets/glosskn-logo-white.png) center/280px 69px no-repeat; opacity: 0; }
      .sub { position: absolute; left: 0; right: 0; top: 196px; font: 600 28px/1 "GK Futura", sans-serif; letter-spacing: 10px; padding-left: 10px; opacity: 0; }
      .bogo { position: absolute; left: 0; right: 0; top: 240px; font: 600 116px/1 "GK Futura", sans-serif; letter-spacing: 2px; color: var(--magenta); opacity: 0; }
      .pre { position: absolute; left: 0; right: 0; top: 372px; font: italic 400 52px/1 "GK Times", serif; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="9" data-width="1080" data-height="1920">
      <div id="grid" class="clip" data-start="0" data-duration="9" data-track-index="1" style="position:absolute;inset:0">
        <div id="stage"></div>
        <div id="lines"></div>
      </div>
      <div id="head" class="clip" data-start="6.2" data-duration="2.8" data-track-index="2">
        <div class="logo" id="logo" role="img" aria-label="GLOSSKN"></div>
        <div class="sub" id="sub">THE BIRTHDAY SALE</div>
        <div class="bogo" id="bogo">BUY 1 GET 1</div>
        <div class="pre" id="pre">+ 5% off on prepaid orders</div>
      </div>
      <!-- soundtrack built by audio/make_audio.py -->
      <audio id="mix" src="sfx/mix.wav" data-start="0" data-duration="9" data-track-index="10"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ---- timeline constants (mirror audio/make_audio.py)
      const SCATTER = [[0.0, 2.4], [3.35, 5.6]], SCATTER_STEP = 0.12;
      const BUILD = [[2.4, 3.0], [5.6, 6.2]];   // tiles click into place one by one
      const COLS = 3, ROWS = 5, TW = 360, TH = 384, YOFF = 6;

      let seed = 1019;
      const rand = () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let x = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };

      // close-up focus points in the 1080x1933 hero (products, candles, box, slice, piping)
      const FOCUS = [[520, 985], [660, 1080], [540, 520], [275, 1450], [800, 1660], [300, 760], [430, 1060]];
      const COPY_C = ["Buy 1<br>Get 1.", "Buy 1<br>Get 1 free."];
      const COPY_D = "+5% off<b>PREPAID</b>";

      const stage = document.getElementById("stage");
      const tiles = [];
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
        const i = tiles.length, x = c * TW, y = r * TH;
        const el = document.createElement("div");
        el.className = "tile";
        el.style.left = x + "px"; el.style.top = y + "px";
        const f1 = FOCUS[i % FOCUS.length], f2 = FOCUS[(i * 3 + 2) % FOCUS.length];
        const pos = (f) => `${-(f[0] * 2 - TW / 2)}px ${-(f[1] * 2 - TH / 2)}px`;
        el.innerHTML =
          `<div class="L a" style="background-position:${-x}px ${-(y + YOFF)}px"></div>` +
          `<div class="L b1" style="background-position:${pos(f1)}"></div>` +
          `<div class="L b2" style="background-position:${pos(f2)}"></div>` +
          `<div class="L c"><span>${COPY_C[i % 2]}</span></div>` +
          `<div class="L d"><span>${COPY_D}</span></div>`;
        stage.appendChild(el);
        tiles.push({ layers: [...el.children], state: -1 });
      }
      const lines = document.getElementById("lines");
      for (let c = 1; c < COLS; c++) { const l = document.createElement("i"); l.style.cssText = `left:${c * TW - 1}px;top:0;width:2px;height:1920px`; lines.appendChild(l); }
      for (let r = 1; r < ROWS; r++) { const l = document.createElement("i"); l.style.cssText = `left:0;top:${r * TH - 1}px;width:1080px;height:2px`; lines.appendChild(l); }

      // states: 0 photo piece in place, 1/2 close-ups, 3 "Buy 1 Get 1.", 4 "+5% off prepaid"
      const pick = () => { const v = rand(); return v < 0.3 ? 0 : v < 0.5 ? 1 : v < 0.7 ? 2 : v < 0.88 ? 3 : 4; };
      const show = (tile, s, at) => {
        if (tile.state === s) return;
        tile.layers.forEach((L, k) => tl.set(L, { opacity: k === s ? 1 : 0 }, at));
        tile.state = s;
      };

      const scatter = ([a, b], first) => {
        tl.set("#lines", { opacity: 1 }, a);
        if (first) tiles.forEach((tile, i) => show(tile, [3, 1, 0, 2, 4, 0, 1, 3, 2, 0, 2, 4, 3, 0, 1][i], a));
        for (let t = a + (first ? SCATTER_STEP : 0); t < b - 1e-6; t += SCATTER_STEP) {
          const n = 1 + Math.floor(rand() * 3);
          for (let k = 0; k < n; k++) {
            const tile = tiles[Math.floor(rand() * tiles.length)];
            let s = pick();
            if (s === tile.state) s = (s + 1) % 5;
            show(tile, s, +t.toFixed(3));
          }
        }
      };
      const build = ([a, b]) => {
        const order = tiles.map((_, i) => i).sort(() => rand() - 0.5);
        const dt = (b - a) / order.length;
        order.forEach((i, k) => show(tiles[i], 0, +(a + k * dt).toFixed(3)));
        tiles.forEach((tile) => show(tile, 0, b));
        tl.set("#lines", { opacity: 0 }, b);
        tl.fromTo("#stage", { scale: 1.05 }, { scale: 1, duration: 0.35, ease: "power3.out", immediateRender: false }, b);
      };

      scatter(SCATTER[0], true);
      build(BUILD[0]);
      scatter(SCATTER[1], false);
      build(BUILD[1]);

      // final reveal with the offer
      tl.fromTo("#stage", { y: 0 }, { y: 50, duration: 2.45, ease: "sine.inOut", immediateRender: false }, 6.55);
      tl.fromTo("#logo", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 6.3);
      tl.fromTo("#sub", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 6.4);
      tl.fromTo("#bogo", { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.2)" }, 6.5);
      tl.fromTo("#pre", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 6.9);

      tl.set({}, {}, 9);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
