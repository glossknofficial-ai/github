<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Power Melt — Ingredient Pour</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #d7b6e2;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #d7b6e2;
      }
      #stage {
        position: absolute;
        inset: 0;
      }
      #scene {
        display: block;
        width: 100%;
        height: 100%;
      }
      .preload {
        display: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1080"
      data-height="1920"
    >
      <div id="stage" class="clip" data-start="0" data-duration="10" data-track-index="0">
        <canvas id="scene" width="1080" height="1920"></canvas>
      </div>

      <img id="img-tube" class="preload" src="assets/tube.png" alt="" />
      <img id="img-ghost" class="preload" src="assets/tube-ghost.png" alt="" />
      <img id="img-set" class="preload" src="assets/set-bg.png" alt="" />
      <img id="img-shadow" class="preload" src="assets/set-shadow.png" alt="" />

      <!-- ASMR foley stems (generated by scripts/make_asmr.py from the cue sheet below) -->
      <audio id="sfx-room" src="assets/audio/room.wav" data-start="0" data-duration="10" data-track-index="1" data-volume="1"></audio>
      <audio id="sfx-moringa" src="assets/audio/moringa-powder.wav" data-start="0" data-duration="10" data-track-index="2" data-volume="1"></audio>
      <audio id="sfx-jojoba" src="assets/audio/jojoba-drops.wav" data-start="0" data-duration="10" data-track-index="3" data-volume="1"></audio>
      <audio id="sfx-plum" src="assets/audio/plum-pour.wav" data-start="0" data-duration="10" data-track-index="4" data-volume="1"></audio>
      <audio id="sfx-squalane" src="assets/audio/squalane-trickle.wav" data-start="0" data-duration="10" data-track-index="5" data-volume="1"></audio>
    </div>

    <!-- Single source of truth for timing; scripts/make_asmr.py reads this block too. -->
    <script type="application/json" id="cues">
      {
        "duration": 10,
        "moringa": { "pourStart": 0.5, "pourEnd": 2.5, "fillStart": 0.8, "fillEnd": 2.9 },
        "jojoba": { "drops": [3.05, 3.32, 3.6, 3.86, 4.12, 4.4, 4.7] },
        "plum": { "pourStart": 5.15, "pourEnd": 7.0, "fillStart": 5.35, "fillEnd": 7.35 },
        "squalane": { "pourStart": 7.45, "pourEnd": 8.95, "fillStart": 7.58, "fillEnd": 9.15 },
        "reveal": { "start": 9.15, "end": 9.6 }
      }
    </script>

    <script>
      (function () {
        var CUES = JSON.parse(document.getElementById("cues").textContent);
        var W = 1080, H = 1920;
        var canvas = document.getElementById("scene");
        var ctx = canvas.getContext("2d");
        var tubeImg = document.getElementById("img-tube");
        var ghostImg = document.getElementById("img-ghost");
        var setImg = document.getElementById("img-set");
        var shadowImg = document.getElementById("img-shadow");

        // Offscreen layers: liquid (masked to tube), photo (masked below reveal line)
        function mk() { var c = document.createElement("canvas"); c.width = W; c.height = H; return c; }
        var liqC = mk(), liq = liqC.getContext("2d");
        var phoC = mk(), pho = phoC.getContext("2d");
        [ctx, liq, pho].forEach(function (c) { c.imageSmoothingEnabled = true; c.imageSmoothingQuality = "high"; });

        // Tube placement — uniform scale only, so the label is never distorted.
        var IMG_W = 731, IMG_H = 1526, S = 0.8;
        var TW = IMG_W * S, TH = IMG_H * S;
        var FLOOR = 1585;
        var TX = (W - TW) / 2, TY = FLOOR - TH;
        var CX = W / 2;
        var FILL_BOTTOM = TY + 1518 * S; // inside of cap
        var FILL_TOP = TY + 78 * S;      // just under the crimp
        var BAND = 64;                   // visible liquid band above the revealed tube

        // ---- helpers -------------------------------------------------------
        function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
        function ease(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
        function easeOut(x) { x = clamp(x, 0, 1); return 1 - Math.pow(1 - x, 3); }
        function mulberry32(a) {
          return function () {
            a |= 0; a = (a + 0x6d2b79f5) | 0;
            var t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
        function gauss(r) { var u = r() || 1e-6, v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.2832 * v); }

        // ---- fill schedule (cumulative fraction 0..1) ----------------------
        var M = CUES.moringa, J = CUES.jojoba, P = CUES.plum, Q = CUES.squalane, R = CUES.reveal;
        function layerFill(t) {
          var m = 0.25 * ease((t - M.fillStart) / (M.fillEnd - M.fillStart));
          var j = 0;
          J.drops.forEach(function (d) { j += (0.25 / J.drops.length) * easeOut((t - d) / 0.35); });
          var p = 0.25 * ease((t - P.fillStart) / (P.fillEnd - P.fillStart));
          var q = 0.25 * ease((t - Q.fillStart) / (Q.fillEnd - Q.fillStart));
          return [m, j, p, q];
        }
        function yAtFill(f) { return FILL_BOTTOM - f * (FILL_BOTTOM - FILL_TOP); }

        // Surface agitation: impacts + active pours
        function agitation(t) {
          var a = 1.2;
          J.drops.forEach(function (d) { if (t > d) a += 9 * Math.exp(-(t - d) * 6); });
          if (t > M.fillStart && t < M.pourEnd + 0.3) a += 2.0;
          if (t > P.fillStart && t < P.pourEnd + 0.4) a += 4.0;
          if (t > Q.fillStart && t < Q.pourEnd + 0.3) a += 2.2;
          return a;
        }
        function wave(x, t, amp) {
          return amp * (0.6 * Math.sin(x * 0.045 + t * 7.0) + 0.4 * Math.sin(x * 0.091 - t * 10.3 + 1.7));
        }

        // ---- precomputed deterministic particles ----------------------------
        var rnd = mulberry32(20261006);
        var powder = [];
        var NP = 3200;
        for (var i = 0; i < NP; i++) {
          var ti = M.pourStart + (M.pourEnd - M.pourStart) * (i / NP) + rnd() * 0.002;
          powder.push({ t: ti, x: CX + gauss(rnd) * 12, vx: gauss(rnd) * 26, v0: 380 + rnd() * 220,
            r: 1.6 + rnd() * 3.0, c: ["#4f7a1c", "#6a9a25", "#86b532", "#5c8a22", "#9cc449", "#3f6a18"][Math.floor(rnd() * 6)],
            a: 0.8 + rnd() * 0.2 });
        }
        var specks = [];
        for (i = 0; i < 70; i++) specks.push({ u: rnd(), v: rnd(), r: 0.8 + rnd() * 1.6, ph: rnd() * 6.28 });
        var splashes = [];
        J.drops.forEach(function (d, k) {
          for (var s = 0; s < 5; s++) splashes.push({ t: d, vx: (rnd() - 0.5) * 300, vy: -(240 + rnd() * 300), r: 3 + rnd() * 4.5, kind: "jojoba" });
        });
        var plumBubbles = [];
        for (i = 0; i < 46; i++) plumBubbles.push({ t: P.fillStart + rnd() * (P.fillEnd - P.fillStart + 0.4), x: (rnd() - 0.5) * 300, r: 1.5 + rnd() * 3.5, sp: 40 + rnd() * 70 });
        var sqDroplets = [];
        for (i = 0; i < 60; i++) sqDroplets.push({ t: Q.pourStart + rnd() * (Q.pourEnd - Q.pourStart), dx: (rnd() - 0.5) * 50, r: 2 + rnd() * 2.8, ph: rnd() * 6.28 });
        var sqSplash = [];
        for (i = 0; i < 30; i++) sqSplash.push({ t: Q.fillStart + rnd() * (Q.pourEnd - Q.fillStart + 0.2), vx: (rnd() - 0.5) * 300, vy: -(150 + rnd() * 260), r: 1.2 + rnd() * 1.8, ph: rnd() * 6.28 });

        // ---- drawing --------------------------------------------------------
        var TOPY = -40;

        function camera(c, t) {
          var k = 1 + 0.035 * ease(t / 10);
          c.setTransform(k, 0, 0, k, CX * (1 - k), 1100 * (1 - k));
        }

        var LAYER_STYLE = [
          { top: "#bcc045", bot: "#7f9a2a" }, // moringa — golden-green
          { top: "#f4d47a", bot: "#dfa94a" }, // jojoba — pale gold wax
          { top: "#e78e38", bot: "#b04d1c" }, // plum kernel — deep amber
          { top: "rgba(255,255,255,0.7)", bot: "rgba(240,232,250,0.5)" } // squalane — clear
        ];

        function layerPath(c, yTop, yBot, t, amp, x0, x1) {
          c.beginPath();
          c.moveTo(x0, yBot);
          for (var x = x0; x <= x1; x += 12) c.lineTo(x, yTop + wave(x, t, amp));
          c.lineTo(x1, yBot);
          c.closePath();
        }

        function drawLiquid(t, fills, amp) {
          liq.setTransform(1, 0, 0, 1, 0, 0);
          liq.clearRect(0, 0, W, H);
          camera(liq, t);
          var x0 = TX - 10, x1 = TX + TW + 10;
          var cum = 0;
          for (var k = 0; k < 4; k++) {
            if (fills[k] <= 0.0005) { continue; }
            var fb = cum, ft = cum + fills[k];
            cum = ft;
            var yb = yAtFill(fb) + (k === 0 ? 30 : 0), yt = yAtFill(ft);
            var isTop = (k === 3 || fills[k + 1] <= 0.0005) || (k < 3 && fills.slice(k + 1).every(function (f) { return f <= 0.0005; }));
            var a = isTop ? amp : amp * 0.25;
            var g = liq.createLinearGradient(0, yt, 0, yt + 140);
            g.addColorStop(0, LAYER_STYLE[k].top);
            g.addColorStop(1, LAYER_STYLE[k].bot);
            liq.fillStyle = g;
            layerPath(liq, yt, yb + 2, t, a, x0, x1);
            liq.fill();

            // per-ingredient texture inside its own layer
            if (k === 0) {
              var bloom = ease((t - 1.4) / 1.6);
              liq.fillStyle = "rgba(96,140,36," + (0.7 * (1 - bloom)) + ")";
              layerPath(liq, yt, yb, t, a, x0, x1); liq.fill();
              specks.forEach(function (s) {
                var y = yt + 6 + s.v * Math.max(0, yb - yt - 10);
                var x = TX + 30 + s.u * (TW - 60) + Math.sin(t * 1.3 + s.ph) * 4;
                liq.fillStyle = "rgba(76,104,30," + (0.85 - 0.55 * bloom) + ")";
                liq.beginPath(); liq.arc(x, y, s.r, 0, 6.2832); liq.fill();
              });
            }
            if (k === 1) {
              // pearly wax sheen
              var sh = liq.createLinearGradient(x0, 0, x1, 0);
              sh.addColorStop(0, "rgba(255,255,255,0)");
              sh.addColorStop(0.3, "rgba(255,250,235,0.28)");
              sh.addColorStop(0.5, "rgba(255,255,255,0.05)");
              sh.addColorStop(0.72, "rgba(255,248,230,0.22)");
              sh.addColorStop(1, "rgba(255,255,255,0)");
              liq.fillStyle = sh; layerPath(liq, yt, yb, t, a, x0, x1); liq.fill();
            }
            if (k === 2) {
              plumBubbles.forEach(function (b) {
                if (t < b.t) return;
                var y = yb - (t - b.t) * b.sp;
                if (y < yt + 4 || y > yb) return;
                var x = CX + b.x + Math.sin((t - b.t) * 5 + b.r) * 3;
                liq.strokeStyle = "rgba(255,220,170,0.75)"; liq.lineWidth = 1.2;
                liq.beginPath(); liq.arc(x, y, b.r, 0, 6.2832); liq.stroke();
                liq.fillStyle = "rgba(255,240,215,0.5)";
                liq.beginPath(); liq.arc(x - b.r * 0.35, y - b.r * 0.35, b.r * 0.35, 0, 6.2832); liq.fill();
              });
            }
            // glossy meniscus line on every surface
            liq.strokeStyle = k === 3 ? "rgba(255,255,255,0.95)" : "rgba(255,248,230,0.55)";
            liq.lineWidth = k === 3 ? 3 : 2;
            liq.beginPath();
            for (var x = x0; x <= x1; x += 12) { var yy = yt + 2 + wave(x, t, a); x === x0 ? liq.moveTo(x, yy) : liq.lineTo(x, yy); }
            liq.stroke();
          }
          // Moringa dust haze settling on the surface
          if (t > M.fillStart - 0.1 && t < M.pourEnd + 0.8) {
            var yS = yAtFill(cum);
            var ha = 0.32 * Math.min(1, (t - M.fillStart + 0.1) * 3) * (1 - ease((t - M.pourEnd) / 0.8));
            var hg = liq.createRadialGradient(CX, yS, 4, CX, yS, 170);
            hg.addColorStop(0, "rgba(110,160,45," + ha * 1.6 + ")");
            hg.addColorStop(1, "rgba(140,165,70,0)");
            liq.fillStyle = hg; liq.fillRect(CX - 200, yS - 120, 400, 150);
          }
          liq.setTransform(1, 0, 0, 1, 0, 0);
          liq.globalCompositeOperation = "destination-in";
          camera(liq, t);
          liq.drawImage(tubeImg, TX, TY, TW, TH);
          liq.globalCompositeOperation = "source-over";
          liq.setTransform(1, 0, 0, 1, 0, 0);
        }

        function drawPhoto(t, revealY) {
          pho.setTransform(1, 0, 0, 1, 0, 0);
          pho.clearRect(0, 0, W, H);
          camera(pho, t);
          pho.drawImage(tubeImg, TX, TY, TW, TH);
          pho.globalCompositeOperation = "destination-in";
          var g = pho.createLinearGradient(0, revealY, 0, revealY + 16);
          g.addColorStop(0, "rgba(0,0,0,0)");
          g.addColorStop(1, "rgba(0,0,0,1)");
          pho.fillStyle = g;
          pho.fillRect(0, revealY, W, H - revealY + 400);
          pho.globalCompositeOperation = "source-over";
          pho.setTransform(1, 0, 0, 1, 0, 0);
        }

        function streamPoly(c, xs, ys, ws) {
          c.beginPath();
          for (var i = 0; i < ys.length; i++) i === 0 ? c.moveTo(xs[i] - ws[i] / 2, ys[i]) : c.lineTo(xs[i] - ws[i] / 2, ys[i]);
          for (i = ys.length - 1; i >= 0; i--) c.lineTo(xs[i] + ws[i] / 2, ys[i]);
          c.closePath();
        }

        // Continuous pour: head falls under gravity from pourStart, tail from pourEnd.
        function pourSpan(t, start, end, surfaceY, g) {
          if (t < start) return null;
          var head = TOPY + 0.5 * g * Math.pow(t - start, 2);
          var tail = t > end ? TOPY + 0.5 * g * Math.pow(t - end, 2) : TOPY;
          head = Math.min(head, surfaceY);
          if (tail >= surfaceY) return null;
          return [tail, head];
        }

        function drawPlum(t, surfaceY) {
          var span = pourSpan(t, P.pourStart, P.pourEnd, surfaceY, 21000);
          if (!span) return;
          var xs = [], ys = [], ws = [];
          for (var y = span[0]; y <= span[1]; y += 10) {
            ys.push(y);
            xs.push(CX + 3.5 * Math.sin(y * 0.011 - t * 8) + 1.5 * Math.sin(y * 0.031 + t * 13));
            var w = 26 - 12 * clamp((y - TOPY) / 1600, 0, 1);
            if (span[1] - y < 30 && span[1] < surfaceY - 1) w *= 0.6 + 0.4 * (span[1] - y) / 30; // rounded head
            ws.push(w);
          }
          if (ys.length < 2) return;
          var g = ctx.createLinearGradient(CX - 14, 0, CX + 14, 0);
          g.addColorStop(0, "#9a3e16"); g.addColorStop(0.35, "#e48a34"); g.addColorStop(0.55, "#f2a84e"); g.addColorStop(1, "#a8461a");
          ctx.fillStyle = g; streamPoly(ctx, xs, ys, ws); ctx.fill();
          ctx.strokeStyle = "rgba(255,236,200,0.7)"; ctx.lineWidth = 2.2;
          ctx.beginPath();
          for (var i = 0; i < ys.length; i++) { var x = xs[i] - ws[i] * 0.18; i === 0 ? ctx.moveTo(x, ys[i]) : ctx.lineTo(x, ys[i]); }
          ctx.stroke();
          // tiny bubbles riding the stream
          for (var b = 0; b < 9; b++) {
            var yy = span[0] + (((t * 520 + b * 173) % 1600));
            if (yy > span[1] - 6 || yy < span[0]) continue;
            var idx = Math.floor((yy - span[0]) / 10);
            if (!xs[idx]) continue;
            ctx.fillStyle = "rgba(255,230,190,0.75)";
            ctx.beginPath(); ctx.arc(xs[idx] + ((b % 3) - 1) * 4, yy, 1.6 + (b % 2), 0, 6.2832); ctx.fill();
          }
          // landing fold
          if (span[1] >= surfaceY - 1) drawRipple(t, surfaceY, 34 + 6 * Math.sin(t * 14), "rgba(255,210,150,0.55)");
        }

        function drawSqualane(t, surfaceY) {
          var span = pourSpan(t, Q.pourStart, Q.pourEnd, surfaceY, 26000);
          if (span) {
            ctx.lineCap = "round";
            var path = function () {
              ctx.beginPath();
              for (var y = span[0]; y <= span[1]; y += 10) {
                var x = CX + 1.6 * Math.sin(y * 0.02 - t * 12);
                y === span[0] ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
              }
            };
            path(); ctx.strokeStyle = "rgba(122,84,146,0.28)"; ctx.lineWidth = 13; ctx.stroke();
            path(); ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth = 8; ctx.stroke();
            path(); ctx.strokeStyle = "rgba(255,255,255,1)"; ctx.lineWidth = 3; ctx.stroke();
            if (span[1] >= surfaceY - 1) drawRipple(t, surfaceY, 22 + 4 * Math.sin(t * 20), "rgba(255,255,255,0.7)");
          }
          // sparkling micro-droplets shed by the thread
          sqDroplets.forEach(function (d) {
            var dt = t - d.t; if (dt < 0) return;
            var y = TOPY + 120 + 0.5 * 26000 * dt * dt;
            if (y > surfaceY) return;
            var x = CX + d.dx * Math.min(1, dt * 4);
            sparkle(x, y, d.r, t, d.ph);
          });
          sqSplash.forEach(function (s) {
            var dt = t - s.t; if (dt < 0 || dt > 0.6) return;
            var x = CX + s.vx * dt, y = surfaceY + s.vy * dt + 0.5 * 1800 * dt * dt;
            if (y > surfaceY + 2) return;
            sparkle(x, y, s.r, t, s.ph);
          });
        }

        function sparkle(x, y, r, t, ph) {
          var tw = 0.55 + 0.45 * Math.sin(t * 30 + ph);
          ctx.fillStyle = "rgba(255,255,255," + (0.85 * tw + 0.15) + ")";
          ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
          ctx.strokeStyle = "rgba(255,255,255," + 0.6 * tw + ")"; ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(x - r * 3.2 * tw, y); ctx.lineTo(x + r * 3.2 * tw, y);
          ctx.moveTo(x, y - r * 3.2 * tw); ctx.lineTo(x, y + r * 3.2 * tw);
          ctx.stroke();
        }

        function drawRipple(t, y, rx, col) {
          ctx.strokeStyle = col; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.ellipse(CX, y + 2, rx, rx * 0.16, 0, 0, 6.2832); ctx.stroke();
        }

        function drawJojoba(t, surfaceY) {
          var FALL = 0.42;
          J.drops.forEach(function (land, k) {
            var t0 = land - FALL;
            if (t >= t0 && t < land) {
              var u = (t - t0) / FALL;
              var y = TOPY - 20 + (surfaceY - TOPY + 20) * u * u;
              var r = 25 + (k % 3) * 3;
              var stretch = 1 + 0.5 * u;
              ctx.save();
              ctx.translate(CX + ((k % 2) ? 3 : -3), y);
              ctx.scale(1 / Math.sqrt(stretch), stretch);
              var g = ctx.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.1, 0, 0, r * 1.1);
              g.addColorStop(0, "#fff6d6"); g.addColorStop(0.35, "#f6d98a"); g.addColorStop(0.85, "#dfaa4c"); g.addColorStop(1, "#c98f36");
              ctx.fillStyle = g;
              ctx.beginPath(); // teardrop: round bottom, tapered top
              ctx.moveTo(0, -r * 1.9);
              ctx.bezierCurveTo(r * 0.55, -r * 1.1, r, -r * 0.35, r, 0);
              ctx.arc(0, 0, r, 0, Math.PI);
              ctx.bezierCurveTo(-r, -r * 0.35, -r * 0.55, -r * 1.1, 0, -r * 1.9);
              ctx.fill();
              ctx.fillStyle = "rgba(255,255,255,0.85)";
              ctx.beginPath(); ctx.ellipse(-r * 0.38, -r * 0.3, r * 0.22, r * 0.34, -0.4, 0, 6.2832); ctx.fill();
              ctx.fillStyle = "rgba(255,250,235,0.35)";
              ctx.beginPath(); ctx.arc(r * 0.35, r * 0.45, r * 0.18, 0, 6.2832); ctx.fill();
              ctx.restore();
            }
            var dt = t - land;
            if (dt >= 0 && dt < 0.5) {
              var e = easeOut(dt / 0.5);
              ctx.strokeStyle = "rgba(255,240,200," + (0.75 * (1 - e)) + ")"; ctx.lineWidth = 2.5;
              ctx.beginPath(); ctx.ellipse(CX, surfaceY + 2, 20 + 120 * e, (20 + 120 * e) * 0.15, 0, 0, 6.2832); ctx.stroke();
            }
          });
          splashes.forEach(function (s) {
            var dt = t - s.t; if (dt < 0 || dt > 0.6) return;
            var x = CX + s.vx * dt, y = surfaceY + s.vy * dt + 0.5 * 2200 * dt * dt;
            if (y > surfaceY + 3) return;
            var g = ctx.createRadialGradient(x - s.r * 0.3, y - s.r * 0.3, 0.5, x, y, s.r);
            g.addColorStop(0, "#fff4cf"); g.addColorStop(1, "#e2b259");
            ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, s.r, 0, 6.2832); ctx.fill();
          });
        }

        function drawMoringa(t, surfaceY) {
          var G = 5200;
          // soft powder haze around the sifting stream
          if (t > M.pourStart && t < M.pourEnd + 0.45) {
            var on = Math.min(1, (t - M.pourStart) * 4) * (1 - ease((t - M.pourEnd) / 0.45));
            var hz = ctx.createLinearGradient(CX - 60, 0, CX + 60, 0);
            hz.addColorStop(0, "rgba(130,156,60,0)");
            hz.addColorStop(0.5, "rgba(110,160,45," + 0.32 * on + ")");
            hz.addColorStop(1, "rgba(130,156,60,0)");
            ctx.fillStyle = hz;
            var headY = Math.min(surfaceY, TOPY + 0.5 * G * Math.pow(t - M.pourStart, 2) + 420 * (t - M.pourStart));
            ctx.fillRect(CX - 60, TOPY, 120, headY - TOPY);
          }
          powder.forEach(function (p) {
            var dt = t - p.t; if (dt < 0) return;
            var y = TOPY + p.v0 * dt + 0.5 * G * dt * dt;
            if (y > surfaceY + 2) return;
            var x = p.x + p.vx * dt;
            ctx.globalAlpha = p.a;
            ctx.fillStyle = p.c;
            ctx.fillRect(x - p.r / 2, y - p.r / 2, p.r, p.r * 1.25);
          });
          ctx.globalAlpha = 1;
        }

        function render(t) {
          var fills = layerFill(t);
          var total = fills[0] + fills[1] + fills[2] + fills[3];
          var surfaceY = yAtFill(total);
          var amp = agitation(t);
          var rv = ease((t - R.start) / (R.end - R.start));
          var band = Math.min(BAND, FILL_BOTTOM - surfaceY + 30);
          var revealY = surfaceY + band - rv * (surfaceY + band - (TY - 40));

          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.fillStyle = "#d7b6e2";
          ctx.fillRect(0, 0, W, H);
          camera(ctx, t);
          ctx.drawImage(setImg, 0, 0, W, H);
          // Glass casts a faint shadow; it deepens as the tube fills and becomes solid.
          ctx.globalAlpha = 0.4 + 0.6 * Math.max(rv, Math.min(1, total * 1.05));
          ctx.drawImage(shadowImg, 0, 0, W, H);
          ctx.globalAlpha = 1;
          ctx.drawImage(ghostImg, TX, TY, TW, TH);

          drawLiquid(t, fills, amp);
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.drawImage(liqC, 0, 0);
          camera(ctx, t);
          ctx.globalAlpha = 0.55;
          ctx.drawImage(ghostImg, TX, TY, TW, TH); // glass sheen over the liquid
          ctx.globalAlpha = 1;

          drawMoringa(t, surfaceY);
          drawJojoba(t, surfaceY);
          drawPlum(t, surfaceY);
          drawSqualane(t, surfaceY);

          // Real packshot, untouched, revealed from the cap upward.
          drawPhoto(t, revealY);
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.drawImage(phoC, 0, 0);
        }

        function build() {
          var state = { t: 0 };
          var tl = gsap.timeline({ paused: true });
          tl.to(state, {
            t: CUES.duration, duration: CUES.duration, ease: "none",
            onUpdate: function () { render(state.t); }
          }, 0);
          render(0);
          window.__timelines["main"] = tl;
          if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
        }

        function ready(img) {
          return img.complete && img.naturalWidth ? Promise.resolve() : new Promise(function (res) { img.onload = res; img.onerror = res; });
        }
        Promise.all([ready(tubeImg), ready(ghostImg), ready(setImg), ready(shadowImg)]).then(build);
      })();
    </script>
  </body>
</html>
